<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09131f">
<meta name="description" content="Cardápio digital do Maré e Brasa. Escolhe os pratos e envia o pedido pelo WhatsApp.">
<title>Maré e Brasa | Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: cardápio mobile-first, azul-marinho profundo com dourado discreto; faixa de pesquisa/categorias fixa, carrinho em barra inferior. */
:root{
  --bg:#09131f; --bg2:#0f1d30; --card:#12233a; --line:rgba(214,176,106,.2);
  --gold:#d6b06a; --gold-d:#a8803c; --cream:#f6efe0; --muted:#9db0c9;
  --ok:#6fcf9a; --err:#f08f7f;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg); color:var(--cream); font:400 15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}

/* hero */
.hero{
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:56px max(20px,env(safe-area-inset-left,0px)) 40px;
  background:
    repeating-linear-gradient(135deg,rgba(214,176,106,.05) 0 2px,transparent 2px 26px),
    radial-gradient(120% 90% at 85% 0%,#1a3558 0%,transparent 60%),
    var(--bg2);
  border-bottom:1px solid var(--line);
}
.hero .wrap{display:flex;flex-direction:column;gap:14px}
.brand{font-size:12px;font-weight:700;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.hero h1{font:400 clamp(34px,9vw,60px)/1.05 var(--display);margin:0;max-width:14ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.chips-info{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips-info span{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--cream);background:rgba(9,19,31,.5)}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;background:rgba(9,19,31,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--cream)}
.search::placeholder{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 16px;color:var(--muted);font-weight:500;transition:.2s}
.cat.on{background:var(--gold);border-color:var(--gold);color:#1b1305;font-weight:700}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(214,176,106,.12);border:1px dashed var(--gold);border-radius:12px;padding:8px 10px}
.editbar b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-right:auto}
.mini{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:13px}
.mini.gold{background:var(--gold);color:#1b1305;border-color:var(--gold);font-weight:700}

/* sections & cards */
main{padding-top:26px;display:flex;flex-direction:column;gap:36px}
.sec h2{font:400 28px/1.1 var(--display);margin:0 0 4px}
.sec .sub{color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.strip .card{flex:none;width:min(78vw,300px);scroll-snap-align:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.off{opacity:.55}
.pic{position:relative;aspect-ratio:4/3;background:#0c1828;max-width:100%}
.pic svg,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;background:var(--gold);color:#1b1305;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:3px 10px}
.tag.hid{left:auto;right:10px;background:#2a3b55;color:var(--cream)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cbody h3{font:600 19px/1.2 var(--display);margin:0}
.cbody p{margin:0;color:var(--muted);font-size:14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.price{font:600 20px var(--display);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.add{background:var(--gold);color:#1b1305;border:0;border-radius:11px;padding:10px 16px;font-weight:700;transition:transform .15s}
.add:active{transform:scale(.96)}
.step{display:flex;align-items:center;gap:4px;border:1px solid var(--gold);border-radius:11px;padding:2px}
.step button{width:36px;height:34px;border:0;background:transparent;font-size:20px;color:var(--gold);border-radius:8px}
.step b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.sold{color:var(--err);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.empty{color:var(--muted);text-align:center;padding:40px 0}

footer{margin-top:50px;padding:30px 0 10px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:center}
footer .brand{font-size:11px}
.manage{background:none;border:0;color:var(--muted);opacity:.55;font-size:12px;text-decoration:underline;padding:6px}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;display:flex;width:100%;max-width:560px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;background:var(--gold);color:#1b1305;border:0;border-radius:16px;padding:15px 18px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.cartbar .n{background:#1b1305;color:var(--gold);border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;margin-right:8px}
.cartbar .t{font:600 18px var(--display);font-variant-numeric:tabular-nums}

/* sheets */
.back{position:fixed;inset:0;z-index:80;background:rgba(3,8,14,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}html{scroll-behavior:auto}}
@media (min-width:640px){.back{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{font:400 26px var(--display);margin:0}
.x{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;color:var(--muted)}
.line{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{min-width:0;flex:1}
.line .nm b{display:block;font-weight:500}
.line .nm small{color:var(--muted)}
.line .sum{font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font:600 24px var(--display);padding:6px 0}
.total span:last-child{color:var(--gold);font-variant-numeric:tabular-nums}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.send{display:block;text-align:center;text-decoration:none;background:#25d366;color:#06240f;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
.send.dis{opacity:.45;pointer-events:none}
.err{color:var(--err);font-size:13px;min-height:1em;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
details summary{cursor:pointer;color:var(--gold);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;font:13px/1.5 var(--body);margin:8px 0 0}
.chk{display:flex;gap:10px;align-items:center}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.photo{display:flex;gap:12px;align-items:center}
.photo .pic{width:110px;border-radius:12px;overflow:hidden;flex:none}
.crow{display:flex;gap:6px;align-items:center;padding:6px 0}
.crow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.danger{border-color:var(--err);color:var(--err)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--card);border:1px solid var(--gold);color:var(--cream);border-radius:12px;padding:10px 16px;max-width:90vw;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.add[disabled],.send.dis{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var WA = '258864301124';          // WhatsApp do restaurante (+258 Moçambique)
var CFG = window.MB_CONFIG || {};                                 // vem do ficheiro config.js
var CONFIGURED = /^https:\/\/[a-z0-9]+\.supabase\.co/.test(CFG.url || '') && !!CFG.key;
var DEMO = /[?&]demo\b/.test(location.search);                   // ?demo = dados de exemplo, sem Supabase
var DEMO_PASS = 'mare2026';                                       // só no modo ?demo
var sb = (!DEMO && CONFIGURED && window.supabase) ? window.supabase.createClient(CFG.url, CFG.key) : null;
var uid = 100;

var DEMO_CATS = [
  {id:'c1',nome:'Entradas'},{id:'c2',nome:'Pratos principais'},
  {id:'c3',nome:'Acompanhamentos'},{id:'c4',nome:'Bebidas'},{id:'c5',nome:'Sobremesas'}
];
var DEMO_DISHES = [
  {id:'d1',cat:'c1',nome:'Camarão ao alho',desc:'Camarão tigre salteado em manteiga, alho e piri-piri suave.',preco:650,art:'shrimp',dest:true},
  {id:'d2',cat:'c1',nome:'Rissóis de camarão',desc:'Massa crocante, recheio cremoso de camarão. Seis unidades.',preco:350,art:'fries'},
  {id:'d3',cat:'c1',nome:'Ameijoas à Bulhão Pato',desc:'Vinho branco, coentros frescos e limão.',preco:480,art:'clam'},
  {id:'d4',cat:'c2',nome:'Frango grelhado',desc:'Meio frango na brasa com molho de piri-piri da casa.',preco:850,art:'chicken',dest:true},
  {id:'d5',cat:'c2',nome:'Caril de caranguejo',desc:'Caranguejo de Inhaca em leite de coco, servido com arroz.',preco:1200,art:'crab',dest:true},
  {id:'d6',cat:'c2',nome:'Matapa com caranguejo',desc:'Folhas de mandioca, amendoim e coco, cozinhadas lentamente.',preco:780,art:'matapa'},
  {id:'d7',cat:'c2',nome:'Lagosta grelhada',desc:'Lagosta fresca na brasa, manteiga de alho e limão.',preco:2400,art:'lobster'},
  {id:'d8',cat:'c2',nome:'Peixe grelhado do dia',desc:'Pescado do dia, legumes salteados e batata cozida.',preco:950,art:'fish'},
  {id:'d9',cat:'c3',nome:'Batatas fritas',desc:'Cortadas à mão, douradas e crocantes.',preco:200,art:'fries'},
  {id:'d10',cat:'c3',nome:'Arroz de coco',desc:'Arroz perfumado cozido em leite de coco.',preco:180,art:'rice'},
  {id:'d11',cat:'c4',nome:'Sumo natural',desc:'Manga, maracujá ou tangerina, conforme a época.',preco:150,art:'drink'},
  {id:'d12',cat:'c4',nome:'Cerveja 2M',desc:'Garrafa de 33 cl, bem gelada.',preco:120,art:'beer'},
  {id:'d13',cat:'c4',nome:'Água mineral',desc:'Garrafa de 50 cl.',preco:60,art:'water'},
  {id:'d14',cat:'c5',nome:'Pudim de coco',desc:'Textura cremosa, calda de caramelo.',preco:280,art:'dessert',dest:true},
  {id:'d15',cat:'c5',nome:'Gelado de manga',desc:'Duas bolas de gelado artesanal de manga.',preco:250,art:'dessert'}
];
DEMO_DISHES.forEach(function(d){d.disp=true;d.vis=true;d.foto=null;});

var cats = [], dishes = [];
var cart = {};
var filter = 'all', q = '', edit = false, sheet = null;
var loading = true, loadErr = false;
var form = {mesa:'',nome:'',pessoas:1,obs:''};
var tmpFoto = null, tmpBlob = null;

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return Number(n).toLocaleString('de-DE')+' MT';}
function dish(id){return dishes.filter(function(d){return d.id===id;})[0];}
function cat(id){return cats.filter(function(c){return c.id===id;})[0];}

/* ---------- dados (Supabase) ---------- */
var FIELD = {cat:'categoria_id',nome:'nome',desc:'descricao',preco:'preco',foto:'foto_url',disp:'disponivel',vis:'visivel',dest:'destaque'};
function mapDish(r){return {id:r.id,cat:r.categoria_id,nome:r.nome,desc:r.descricao||'',preco:r.preco,art:r.arte||'default',foto:r.foto_url,disp:r.disponivel,vis:r.visivel,dest:r.destaque};}
function errMsg(e){
  var m=String((e&&e.message)||e||'');
  if(/row-level security|permission|JWT|not authorized/i.test(m)) return 'Sem permissão. Entra outra vez em "Gerir cardápio".';
  if(/fetch|network|Failed/i.test(m)) return 'Sem ligação à internet. Tenta outra vez.';
  if(/foreign key/i.test(m)) return 'Esta categoria ainda tem pratos.';
  return 'Não foi possível guardar. Tenta outra vez.';
}
var toastT=null;
function toast(msg){
  var t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3800);
}
async function load(){
  if(DEMO){
    if(!cats.length){cats=JSON.parse(JSON.stringify(DEMO_CATS));dishes=JSON.parse(JSON.stringify(DEMO_DISHES));}
    return;
  }
  if(!sb) throw new Error('Failed to fetch');
  var a=await sb.from('mb_categorias').select('id,nome,ordem').order('ordem').order('created_at');
  var b=await sb.from('mb_pratos').select('*').order('ordem').order('created_at');
  if(a.error) throw a.error;
  if(b.error) throw b.error;
  cats=a.data.map(function(c){return {id:c.id,nome:c.nome};});
  dishes=b.data.map(mapDish);
  Object.keys(cart).forEach(function(k){var d=dish(k);if(!d||!d.disp||!d.vis)delete cart[k];});
  if(filter!=='all'&&!cat(filter))filter='all';
}
async function updDish(id,patch){
  if(DEMO){Object.assign(dish(id),patch);return;}
  var row={updated_at:new Date().toISOString()};
  Object.keys(patch).forEach(function(k){row[FIELD[k]]=patch[k];});
  var r=await sb.from('mb_pratos').update(row).eq('id',id);
  if(r.error) throw r.error;
}
async function run(fn,after){
  try{await fn();await load();render();if(after)after();}
  catch(e){console.error(e);toast(errMsg(e));}
}
async function isAdmin(){
  if(DEMO) return true;
  var r=await sb.rpc('mb_is_admin');
  return !r.error && r.data===true;
}

/* ---------- ilustrações dos pratos ---------- */
function art(kind){
  var bg='#0c1828', food='', plate=true;
  var g='<defs><radialGradient id="pg" cx="40%" cy="35%"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#e3d8c3"/></radialGradient></defs>';
  switch(kind){
    case 'shrimp':
      for(var i=0;i<5;i++){food+='<ellipse cx="'+(150+i*25)+'" cy="'+(140+(i%2)*28)+'" rx="38" ry="15" fill="#ec8a4e" transform="rotate('+(-30+i*22)+' '+(150+i*25)+' '+(140+(i%2)*28)+')"/><ellipse cx="'+(145+i*25)+'" cy="'+(134+(i%2)*28)+'" rx="22" ry="5" fill="#f6b27d" transform="rotate('+(-30+i*22)+' '+(150+i*25)+' '+(140+(i%2)*28)+')"/>';}
      food+='<circle cx="170" cy="105" r="5" fill="#4f9a55"/><circle cx="230" cy="190" r="6" fill="#4f9a55"/><circle cx="250" cy="120" r="4" fill="#4f9a55"/>';break;
    case 'chicken':
      food+='<ellipse cx="175" cy="150" rx="55" ry="32" fill="#a85a26" transform="rotate(-18 175 150)"/><ellipse cx="228" cy="158" rx="46" ry="28" fill="#b9682d" transform="rotate(14 228 158)"/><ellipse cx="170" cy="140" rx="30" ry="9" fill="#d98c4c" transform="rotate(-18 170 140)"/><ellipse cx="226" cy="150" rx="26" ry="8" fill="#d98c4c" transform="rotate(14 226 150)"/><path d="M250 105q25 5 30 25q-22 -2 -30 -25z" fill="#cf3b2c"/>';break;
    case 'crab': case 'matapa':
      var c1=kind==='crab'?'#d8643a':'#3f7a45', c2=kind==='crab'?'#f08a58':'#5a9a58';
      food+='<circle cx="200" cy="150" r="70" fill="'+c1+'"/><circle cx="200" cy="150" r="56" fill="'+c2+'" opacity=".55"/>';
      if(kind==='crab'){food+='<ellipse cx="165" cy="130" rx="26" ry="14" fill="#c8402a" transform="rotate(-30 165 130)"/><ellipse cx="238" cy="165" rx="24" ry="13" fill="#c8402a" transform="rotate(25 238 165)"/><ellipse cx="206" cy="150" rx="18" ry="11" fill="#f6d9b0"/>';}
      else{food+='<circle cx="180" cy="135" r="9" fill="#2f5e36"/><circle cx="225" cy="160" r="11" fill="#2f5e36"/><circle cx="205" cy="125" r="6" fill="#d9a35a"/><ellipse cx="205" cy="170" rx="16" ry="9" fill="#e2744a"/>';}
      break;
    case 'lobster':
      for(var j=0;j<5;j++){food+='<ellipse cx="'+(130+j*34)+'" cy="152" rx="24" ry="'+(30-j*3)+'" fill="'+(j%2?'#d4482c':'#e2603c')+'"/>';}
      food+='<ellipse cx="108" cy="150" rx="22" ry="34" fill="#c23a22"/><path d="M290 150l30-24v48z" fill="#d4482c"/><path d="M160 108h120" stroke="#f6e6b8" stroke-width="5" stroke-linecap="round"/>';break;
    case 'fish':
      food+='<ellipse cx="195" cy="152" rx="78" ry="38" fill="#c9a36a"/><path d="M265 152l45-34v68z" fill="#b48a52"/><circle cx="145" cy="144" r="6" fill="#2b2118"/><path d="M165 125q30 25 0 54" stroke="#9c7440" stroke-width="3" fill="none"/><circle cx="215" cy="200" r="20" fill="#f4d34a"/><circle cx="215" cy="200" r="13" fill="#fbe98a"/>';break;
    case 'fries':
      for(var k=0;k<9;k++){food+='<rect x="'+(140+k*14)+'" y="'+(110+(k%3)*8)+'" width="11" height="'+(70+(k%4)*6)+'" rx="4" fill="'+(k%2?'#efc04e':'#f6d067')+'" transform="rotate('+((k-4)*6)+' 200 160)"/>';}break;
    case 'rice':
      food+='<ellipse cx="200" cy="155" rx="72" ry="48" fill="#fbf6ea" stroke="#e3d8c3" stroke-width="4"/>';
      for(var m=0;m<26;m++){food+='<ellipse cx="'+(150+(m*37)%100)+'" cy="'+(130+(m*23)%50)+'" rx="6" ry="2.6" fill="#efe4cc" transform="rotate('+(m*29%180)+' '+(150+(m*37)%100)+' '+(130+(m*23)%50)+')"/>';}break;
    case 'clam':
      for(var n=0;n<6;n++){var a=n/6*6.283;food+='<ellipse cx="'+(200+Math.cos(a)*52)+'" cy="'+(150+Math.sin(a)*38)+'" rx="22" ry="15" fill="#a88d6a" transform="rotate('+(a*57)+' '+(200+Math.cos(a)*52)+' '+(150+Math.sin(a)*38)+')"/>';}
      food+='<circle cx="200" cy="150" r="14" fill="#4f9a55"/>';break;
    case 'dessert':
      food+='<ellipse cx="200" cy="175" rx="68" ry="16" fill="#8a5a2a"/><path d="M140 170q0-62 60-62t60 62z" fill="#f2d79b"/><path d="M150 140q50-22 100 0" stroke="#b9772f" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="200" cy="100" r="8" fill="#c93a45"/>';break;
    case 'drink': case 'beer': case 'water':
      plate=false;
      var fill=kind==='drink'?'#f19a2a':kind==='beer'?'#d9962b':'#8fc8e6';
      if(kind==='drink'){food+='<path d="M150 80h100l-14 150h-72z" fill="#cfe3f4" opacity=".25"/><path d="M155 120h90l-9 110h-72z" fill="'+fill+'"/><path d="M155 120h90" stroke="#ffd18a" stroke-width="5"/><circle cx="250" cy="82" r="22" fill="#f6c34a"/><circle cx="250" cy="82" r="14" fill="#fbe08a"/>';}
      else{food+='<rect x="172" y="60" width="56" height="170" rx="14" fill="'+fill+'"/><rect x="184" y="40" width="32" height="40" rx="6" fill="'+fill+'"/><rect x="172" y="128" width="56" height="52" fill="#f6efe0"/><rect x="182" y="140" width="36" height="6" fill="#1b2a44"/><rect x="182" y="154" width="24" height="5" fill="#d6b06a"/>';}
      break;
    default: food+='<circle cx="200" cy="150" r="50" fill="#d6b06a"/>';
  }
  var base=plate?'<circle cx="200" cy="154" r="128" fill="#050c14" opacity=".5"/><circle cx="200" cy="150" r="124" fill="url(#pg)"/><circle cx="200" cy="150" r="98" fill="none" stroke="#d3c6ac" stroke-width="2"/>':'<ellipse cx="200" cy="236" rx="90" ry="10" fill="#050c14" opacity=".5"/>';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">'+g+'<rect width="400" height="300" fill="'+bg+'"/><rect width="400" height="300" fill="#d6b06a" opacity=".05"/>'+base+food+'</svg>';
}

/* ---------- cartão ---------- */
function card(d){
  var n=cart[d.id]||0, act;
  if(!d.disp) act='<span class="sold">Esgotado</span>';
  else if(n) act='<div class="step"><button data-a="dec" data-id="'+d.id+'" aria-label="Menos um '+esc(d.nome)+'">−</button><b>'+n+'</b><button data-a="inc" data-id="'+d.id+'" aria-label="Mais um '+esc(d.nome)+'">+</button></div>';
  else act='<button class="add" data-a="inc" data-id="'+d.id+'">Adicionar</button>';
  var tools='';
  if(edit) tools='<div class="tools"><button class="mini" data-a="editdish" data-id="'+d.id+'">Editar</button><button class="mini" data-a="vis" data-id="'+d.id+'">'+(d.vis?'Ocultar':'Mostrar')+'</button><button class="mini" data-a="disp" data-id="'+d.id+'">'+(d.disp?'Marcar esgotado':'Marcar disponível')+'</button><button class="mini" data-a="dest" data-id="'+d.id+'">'+(d.dest?'Tirar destaque':'Destacar')+'</button></div>';
  return '<article class="card'+(d.vis?'':' off')+'"><div class="pic">'+(d.foto?'<img src="'+d.foto+'" alt="'+esc(d.nome)+'">':art(d.art))+(d.dest?'<span class="tag">Destaque</span>':'')+(d.vis?'':'<span class="tag hid">Oculto</span>')+'</div><div class="cbody"><h3>'+esc(d.nome)+'</h3><p>'+esc(d.desc)+'</p><div class="row"><span class="price">'+money(d.preco)+'</span>'+act+'</div>'+tools+'</div></article>';
}

/* ---------- página ---------- */
function shown(d){
  if(!edit && !d.vis) return false;
  if(filter!=='all' && d.cat!==filter) return false;
  if(q && (d.nome+' '+d.desc).toLowerCase().indexOf(q)<0) return false;
  return true;
}
function cartCount(){var c=0;for(var k in cart)c+=cart[k];return c;}
function cartTotal(){var t=0;for(var k in cart){var d=dish(k);if(d)t+=d.preco*cart[k];}return t;}

function build(){
  var html='';
  html+='<header class="hero"><div class="wrap"><span class="brand">Maré e Brasa</span><h1>Do mar à <em>brasa</em>, direto à mesa.</h1><p>Escolhe os pratos, indica a tua mesa e envia o pedido para o WhatsApp do restaurante.</p><div class="chips-info"><span>Maputo, Moçambique</span><span>Marisco e grelhados</span></div></div></header>';
  html+='<div class="bar"><div class="wrap" id="barwrap"></div></div>';
  html+='<div class="wrap"><main id="main"></main><footer><span class="brand">Maré e Brasa</span><span>Uma experiência de sabor.</span><button class="manage" data-a="manage" id="manage"></button></footer></div>';
  html+='<div class="cartbar" id="cartbar"></div><div id="sheetroot"></div>';
  $('#app').innerHTML=html;
  renderBar();
  render();
}

function renderBar(){
  var h='';
  if(edit) h+='<div class="editbar"><b>Modo de edição</b><button class="mini gold" data-a="newdish">+ Novo prato</button><button class="mini" data-a="cats">Categorias</button><button class="mini" data-a="exit">Sair</button></div>';
  h+='<input id="search" class="search" type="search" placeholder="Procurar no cardápio" aria-label="Procurar no cardápio" value="'+esc(q)+'">';
  h+='<div class="cats" id="catrow"></div>';
  $('#barwrap').innerHTML=h;
  $('#search').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render();});
  renderChips();
}
function renderChips(){
  var h='<button class="cat'+(filter==='all'?' on':'')+'" data-a="filter" data-id="all">Todos</button>';
  cats.forEach(function(c){h+='<button class="cat'+(filter===c.id?' on':'')+'" data-a="filter" data-id="'+c.id+'">'+esc(c.nome)+'</button>';});
  $('#catrow').innerHTML=h;
}

function render(){
  renderChips();
  $('#manage').textContent=edit?'':'Gerir cardápio';
  if(loading){$('#main').innerHTML='<p class="empty">A carregar o cardápio…</p>';return;}
  if(loadErr){$('#main').innerHTML=CONFIGURED?'<p class="empty">Não foi possível carregar o cardápio.<br><br><button class="add" data-a="retry">Tentar outra vez</button></p>':'<p class="empty">Falta ligar ao Supabase.<br>Preenche o ficheiro <b>config.js</b> com o endereço e a chave do projeto.</p>';$('#cartbar').innerHTML='';return;}
  var h='', any=false;
  if(filter==='all' && !q){
    var f=dishes.filter(function(d){return d.dest && d.vis;});
    if(f.length){h+='<section class="sec"><p class="sub">Escolhas da casa</p><h2>Destaques</h2><div class="strip">'+f.map(card).join('')+'</div></section>';}
  }
  cats.forEach(function(c){
    var l=dishes.filter(function(d){return d.cat===c.id && shown(d);});
    if(!l.length) return;
    any=true;
    h+='<section class="sec"><h2>'+esc(c.nome)+'</h2><div class="grid" style="margin-top:14px">'+l.map(card).join('')+'</div></section>';
  });
  if(!any) h+='<p class="empty">Não encontrámos pratos para esta pesquisa.</p>';
  $('#main').innerHTML=h;
  var n=cartCount();
  $('#cartbar').innerHTML=(n&&!sheet)?'<button data-a="cart"><span><span class="n">'+n+'</span>Ver pedido</span><span class="t">'+money(cartTotal())+'</span></button>':'';
  if(sheet==='cart') updateCart();
}

/* ---------- mensagem WhatsApp ---------- */
function message(){
  var m=String(form.mesa).trim(); if(/^\d$/.test(m)) m='0'+m;
  var l=['NOVO PEDIDO — MARÉ E BRASA','','Mesa: '+m,'Cliente: '+form.nome.trim(),'Número de pessoas: '+form.pessoas,'','PEDIDO:'];
  dishes.forEach(function(d){var n=cart[d.id];if(n)l.push(n+' × '+d.nome+' — '+money(d.preco)+(n>1?' cada':''));});
  l.push('','Total: '+money(cartTotal()));
  if(form.obs.trim()) l.push('Observações: '+form.obs.trim());
  return l.join('\n');
}

/* ---------- folhas ---------- */
function openSheet(name,html){
  sheet=name;
  $('#sheetroot').innerHTML='<div class="back" data-a="backdrop"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  $('#cartbar').innerHTML='';
  document.body.style.overflow='hidden';
}
function closeSheet(){
  sheet=null;tmpFoto=null;tmpBlob=null;
  $('#sheetroot').innerHTML='';
  document.body.style.overflow='';
  render();
}

function openCart(){
  openSheet('cart',
   '<div class="sh"><h2>O teu pedido</h2><button class="x" data-a="close">Fechar</button></div>'+
   '<div id="cartItems"></div>'+
   '<div class="two"><div class="f"><label for="f-mesa">Mesa</label><input id="f-mesa" inputmode="numeric" maxlength="4" placeholder="Ex.: 8" value="'+esc(form.mesa)+'"></div>'+
   '<div class="f"><label for="f-pes">Pessoas</label><input id="f-pes" type="number" min="1" max="30" inputmode="numeric" value="'+form.pessoas+'"></div></div>'+
   '<div class="f"><label for="f-nome">O teu nome</label><input id="f-nome" autocomplete="given-name" placeholder="Ex.: Edmilson" value="'+esc(form.nome)+'"></div>'+
   '<div class="f"><label for="f-obs">Observações (opcional)</label><textarea id="f-obs" placeholder="Ex.: sem picante">'+esc(form.obs)+'</textarea></div>'+
   '<details><summary>Ver a mensagem que será enviada</summary><pre id="preview"></pre></details>'+
   '<p class="err" id="ferr"></p>'+
   '<a id="send" class="send" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>'+
   '<p class="note">Abre o WhatsApp com o pedido já escrito. O pedido só chega ao restaurante quando carregares em enviar dentro do WhatsApp.</p>');
  ['mesa','pes','nome','obs'].forEach(function(k){
    $('#f-'+k).addEventListener('input',function(e){
      var v=e.target.value;
      if(k==='mesa')form.mesa=v;else if(k==='pes')form.pessoas=Math.max(1,parseInt(v,10)||1);else if(k==='nome')form.nome=v;else form.obs=v;
      refreshSend();
    });
  });
  updateCart();
}
function updateCart(){
  var el=$('#cartItems'); if(!el) return;
  var h='',n=0;
  dishes.forEach(function(d){var c=cart[d.id];if(!c)return;n++;
    h+='<div class="line"><div class="nm"><b>'+esc(d.nome)+'</b><small>'+money(d.preco)+'</small></div><div class="step"><button data-a="dec" data-id="'+d.id+'" aria-label="Menos">−</button><b>'+c+'</b><button data-a="inc" data-id="'+d.id+'" aria-label="Mais">+</button></div><div class="sum">'+money(d.preco*c)+'</div></div>';});
  if(!n) h='<p class="empty">O pedido está vazio.</p>';
  else h+='<div class="total"><span>Total</span><span>'+money(cartTotal())+'</span></div><button class="x" data-a="clear" style="align-self:flex-start">Limpar pedido</button>';
  el.innerHTML=h;
  refreshSend();
}
function refreshSend(){
  var s=$('#send'); if(!s) return;
  var empty=cartCount()===0;
  s.classList.toggle('dis',empty);
  s.href='https://wa.me/'+WA+'?text='+encodeURIComponent(message());
  $('#preview').textContent=empty?'':message();
  if(!empty) s.onclick=function(e){
    var err='';
    if(!String(form.mesa).trim()) err='Indica o número da tua mesa.';
    else if(!form.nome.trim()) err='Escreve o teu nome.';
    $('#ferr').textContent=err;
    if(err){e.preventDefault();var f=$(!String(form.mesa).trim()?'#f-mesa':'#f-nome');if(f)f.focus();}
  };
}

function openLogin(){
  openSheet('login',
   '<div class="sh"><h2>Gerir cardápio</h2><button class="x" data-a="close">Fechar</button></div>'+
   '<div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email"></div>'+
   '<div class="f"><label for="pw">Palavra-passe</label><input id="pw" type="password" autocomplete="current-password"></div>'+
   '<p class="err" id="pwerr"></p><button class="add" id="loginbtn" data-a="login" style="padding:14px">Entrar</button>'+
   '<p class="note">'+(DEMO?'Modo de demonstração: escreve qualquer email e a palavra-passe <b>mare2026</b>.':'Entra com a conta do restaurante. A palavra-passe é verificada no servidor.')+'</p>');
  $('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  setTimeout(function(){var p=$('#em');if(p)p.focus();},50);
}
async function doLogin(){
  var em=$('#em').value.trim(), pw=$('#pw').value, btn=$('#loginbtn'), er=$('#pwerr');
  if(!em||!pw){er.textContent='Escreve o email e a palavra-passe.';return;}
  btn.disabled=true;er.textContent='';
  try{
    if(DEMO){
      if(pw!==DEMO_PASS) throw new Error('bad');
    }else{
      var r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error) throw new Error('bad');
      if(!(await isAdmin())){await sb.auth.signOut();er.textContent='Esta conta não tem permissão para gerir o cardápio.';btn.disabled=false;return;}
    }
    edit=true;
    try{await load();}catch(e){}
    closeSheet();renderBar();render();
  }catch(e){
    er.textContent='Email ou palavra-passe incorretos.';
    btn.disabled=false;
  }
}
async function manage(){
  if(!DEMO&&sb){
    try{
      var s=await sb.auth.getSession();
      if(s.data&&s.data.session&&await isAdmin()){edit=true;try{await load();}catch(e){}renderBar();render();return;}
    }catch(e){}
  }
  openLogin();
}
async function exitEdit(){
  edit=false;
  if(sb){try{await sb.auth.signOut();}catch(e){}}
  try{await load();}catch(e){}
  renderBar();render();
}

function openDish(id){
  var d=id?dish(id):{id:null,cat:cats[0]?cats[0].id:'',nome:'',desc:'',preco:0,art:'default',foto:null,disp:true,vis:true,dest:false};
  tmpFoto=d.foto;tmpBlob=null;
  var opts=cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===d.cat?' selected':'')+'>'+esc(c.nome)+'</option>';}).join('');
  openSheet('dish',
   '<div class="sh"><h2>'+(id?'Editar prato':'Novo prato')+'</h2><button class="x" data-a="close">Fechar</button></div>'+
   '<div class="photo"><div class="pic" id="ph">'+(d.foto?'<img src="'+d.foto+'" alt="">':art(d.art))+'</div><div class="f" style="flex:1"><label for="e-foto">Fotografia</label><input id="e-foto" type="file" accept="image/*"></div></div>'+
   '<div class="f"><label for="e-nome">Nome</label><input id="e-nome" value="'+esc(d.nome)+'"></div>'+
   '<div class="f"><label for="e-desc">Descrição</label><textarea id="e-desc">'+esc(d.desc)+'</textarea></div>'+
   '<div class="two"><div class="f"><label for="e-preco">Preço (MT)</label><input id="e-preco" type="number" min="0" inputmode="numeric" value="'+d.preco+'"></div><div class="f"><label for="e-cat">Categoria</label><select id="e-cat">'+opts+'</select></div></div>'+
   '<label class="chk"><input id="e-disp" type="checkbox"'+(d.disp?' checked':'')+'> Disponível</label>'+
   '<label class="chk"><input id="e-vis" type="checkbox"'+(d.vis?' checked':'')+'> Visível no cardápio</label>'+
   '<label class="chk"><input id="e-dest" type="checkbox"'+(d.dest?' checked':'')+'> Em destaque</label>'+
   '<p class="err" id="eerr"></p>'+
   '<button class="add" data-a="savedish" data-id="'+(id||'')+'" style="padding:14px">Guardar</button>'+
   (id?'<button class="x danger" data-a="del" data-id="'+id+'" id="delbtn">Remover prato</button>':''));
  $('#e-foto').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        tmpFoto=c.toDataURL('image/jpeg',.82);
        tmpBlob=null;
        c.toBlob(function(b){tmpBlob=b;},'image/jpeg',.82);
        $('#ph').innerHTML='<img src="'+tmpFoto+'" alt="">';
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
async function saveDish(id){
  var nome=$('#e-nome').value.trim(), preco=parseInt($('#e-preco').value,10), er=$('#eerr'), btn=$('[data-a=savedish]');
  if(!nome){er.textContent='Escreve o nome do prato.';return;}
  if(isNaN(preco)||preco<0||preco>1000000){er.textContent='Indica um preço válido.';return;}
  if(!$('#e-cat').value){er.textContent='Cria primeiro uma categoria.';return;}
  var v={nome:nome,desc:$('#e-desc').value.trim().slice(0,400),preco:preco,cat:$('#e-cat').value,
    disp:$('#e-disp').checked,vis:$('#e-vis').checked,dest:$('#e-dest').checked,foto:tmpFoto};
  btn.disabled=true;er.textContent='';
  try{
    if(!DEMO&&tmpBlob){
      var path=(crypto.randomUUID?crypto.randomUUID():String(Date.now()))+'.jpg';
      var up=await sb.storage.from('mb-fotos').upload(path,tmpBlob,{contentType:'image/jpeg',cacheControl:'31536000'});
      if(up.error) throw up.error;
      v.foto=sb.storage.from('mb-fotos').getPublicUrl(path).data.publicUrl;
    }
    if(DEMO){
      if(id) Object.assign(dish(id),v); else dishes.push(Object.assign({id:'d'+(++uid),art:'default'},v));
    }else if(id){
      await updDish(id,v);
    }else{
      var max=dishes.filter(function(d){return d.cat===v.cat;}).length+1;
      var r=await sb.from('mb_pratos').insert({categoria_id:v.cat,nome:v.nome,descricao:v.desc,preco:v.preco,foto_url:v.foto,
        disponivel:v.disp,visivel:v.vis,destaque:v.dest,ordem:max});
      if(r.error) throw r.error;
    }
    await load();closeSheet();
  }catch(e){console.error(e);er.textContent=errMsg(e);btn.disabled=false;}
}

function openCats(){
  var h='<div class="sh"><h2>Categorias</h2><button class="x" data-a="close">Fechar</button></div>';
  cats.forEach(function(c,i){
    var used=dishes.some(function(d){return d.cat===c.id;});
    h+='<div class="crow"><input data-cat="'+c.id+'" value="'+esc(c.nome)+'" aria-label="Nome da categoria"><button class="mini" data-a="up" data-id="'+c.id+'" aria-label="Subir"'+(i?'':' disabled')+'>▲</button><button class="mini" data-a="down" data-id="'+c.id+'" aria-label="Descer"'+(i<cats.length-1?'':' disabled')+'>▼</button><button class="mini danger" data-a="delcat" data-id="'+c.id+'"'+(used?' disabled title="Tem pratos"':'')+' aria-label="Remover">✕</button></div>';
  });
  h+='<div class="crow"><input id="newcat" placeholder="Nova categoria" aria-label="Nova categoria"><button class="mini gold" data-a="addcat">Adicionar</button></div><p class="note">Só é possível remover categorias sem pratos.</p>';
  openSheet('cats',h);
  document.querySelectorAll('[data-cat]').forEach(function(i){i.addEventListener('change',function(){
    var c=cat(i.getAttribute('data-cat')), v=i.value.trim().slice(0,60);
    if(!c||!v){if(c)i.value=c.nome;return;}
    run(async function(){
      if(DEMO){c.nome=v;return;}
      var r=await sb.from('mb_categorias').update({nome:v}).eq('id',c.id);
      if(r.error)throw r.error;
    });
  });});
}
async function moveCat(id,dir){
  var i=cats.indexOf(cat(id)), j=i+dir;
  if(j<0||j>=cats.length) return;
  var arr=cats.slice();var x=arr[i];arr[i]=arr[j];arr[j]=x;
  await run(async function(){
    if(DEMO){cats=arr;return;}
    for(var k=0;k<arr.length;k++){
      var r=await sb.from('mb_categorias').update({ordem:k+1}).eq('id',arr[k].id);
      if(r.error)throw r.error;
    }
  },openCats);
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t) return;
  var a=t.getAttribute('data-a'), id=t.getAttribute('data-id'), d;
  if(a==='backdrop'){if(e.target===t)closeSheet();return;}
  switch(a){
    case 'inc': d=dish(id);if(d&&d.disp){cart[id]=Math.min(20,(cart[id]||0)+1);render();}break;
    case 'dec': if(cart[id]){cart[id]--;if(!cart[id])delete cart[id];render();}break;
    case 'filter': filter=id;render();break;
    case 'cart': openCart();break;
    case 'close': closeSheet();break;
    case 'clear': cart={};render();break;
    case 'manage': manage();break;
    case 'login': doLogin();break;
    case 'exit': exitEdit();break;
    case 'retry': loading=true;loadErr=false;render();init();break;
    case 'newdish': openDish(null);break;
    case 'editdish': openDish(id);break;
    case 'savedish': saveDish(id||null);break;
    case 'vis': d=dish(id);run(function(){return updDish(id,{vis:!d.vis});});break;
    case 'disp': d=dish(id);run(function(){if(d.disp)delete cart[id];return updDish(id,{disp:!d.disp});});break;
    case 'dest': d=dish(id);run(function(){return updDish(id,{dest:!d.dest});});break;
    case 'del':
      if(t.getAttribute('data-sure')){
        t.disabled=true;
        run(async function(){
          delete cart[id];
          if(DEMO){dishes=dishes.filter(function(x){return x.id!==id;});return;}
          var r=await sb.from('mb_pratos').delete().eq('id',id);
          if(r.error)throw r.error;
        },closeSheet);
      }else{t.setAttribute('data-sure','1');t.textContent='Carrega outra vez para confirmar';}
      break;
    case 'cats': openCats();break;
    case 'up': moveCat(id,-1);break;
    case 'down': moveCat(id,1);break;
    case 'delcat':
      run(async function(){
        if(DEMO){cats=cats.filter(function(c){return c.id!==id;});return;}
        var r=await sb.from('mb_categorias').delete().eq('id',id);
        if(r.error)throw r.error;
      },openCats);break;
    case 'addcat':
      var v=$('#newcat').value.trim().slice(0,60);
      if(v)run(async function(){
        if(DEMO){cats.push({id:'c'+(++uid),nome:v});return;}
        var r=await sb.from('mb_categorias').insert({nome:v,ordem:cats.length+1});
        if(r.error)throw r.error;
      },openCats);
      break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet();});

async function init(){
  try{await load();loadErr=false;}catch(e){console.error(e);loadErr=true;}
  loading=false;render();
}
build();
init();
})();
</script>
